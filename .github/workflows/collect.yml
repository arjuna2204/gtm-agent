name: collect-signals

on:
  schedule:
    - cron: "23 10 * * *"   # daily ~5:23am ET
  workflow_dispatch:
    inputs:
      days:
        description: "Business days of Form D filings to scan (use 30 for the first backfill)"
        default: "5"
      detect:
        description: "Max Form D companies to probe for job boards"
        default: "150"

permissions:
  contents: write

concurrency:
  group: collect-signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Repo variable (Settings > Secrets and variables > Actions > Variables), e.g. "Pipeline Scout you@example.com".
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SEC contact is set
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Set the SEC_USER_AGENT repo variable (a name and contact email) before running."
            exit 1
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Collect signals
        run: python -m scout.collect all --days "${{ inputs.days || '5' }}" --detect "${{ inputs.detect || '150' }}"

      - name: Commit data
        run: |
          git config user.name "pipeline-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily signal collection $(date -u +%F)"
          git push
