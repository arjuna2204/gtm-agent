name: weekly-score-and-write

on:
  schedule:
    - cron: "47 3 * * 1"   # Sunday night ~10:47pm ET
  workflow_dispatch:
    inputs:
      top:
        description: "How many top accounts get Claude write-ups"
        default: "100"
      no_ai:
        description: "Scores only, no API calls"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-signals   # never overlaps the daily collection
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Score and write
        run: |
          if [ "${{ inputs.no_ai }}" = "true" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Running scores only (no API key or no_ai set)"
            python -m scout.weekly --no-ai
          else
            python -m scout.weekly --top "${{ inputs.top || '100' }}"
          fi
      - name: Export site data
        run: python -m scout.export

      - name: Commit data
        run: |
          git config user.name "pipeline-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/gtm/data/
          git diff --cached --quiet || git commit -m "data: weekly scores and write-ups $(date -u +%F)"
          git pull --rebase
          git push
