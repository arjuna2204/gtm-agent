<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Scout · Find accounts</title>
<meta name="description" content="Describe your product and buyer. Pipeline Scout ranks companies showing buying signals right now and drafts sourced outreach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gtm/assets/site.css">
<style>
body{font-size:16px}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
.field{margin-bottom:16px}
.field label,.label{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:10px 12px;min-height:44px}
.field textarea{min-height:72px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:32px;margin:28px 0 8px;color:var(--muted);font-size:14px}
.stats b{display:block;font-size:26px;color:var(--ink);font-weight:600}
tr.row{cursor:pointer}tr.row:hover td{background:var(--sand)}
.co{font-weight:600;color:var(--ink)}
.sub{font-size:13px;color:var(--muted)}
.score{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);min-width:110px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:50px}.bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:40px 0 12px}
.empty{padding:48px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-top:24px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
ul.why{padding-left:20px;margin:0}ul.why li{margin-bottom:10px}
.src{font-size:13px;margin-left:6px}
.email{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--ground)}
.email .subj{font-weight:600;color:var(--ink);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
.email pre{white-space:pre-wrap;font-family:inherit;margin:0}
.copy{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.alert{border-radius:12px;padding:14px 16px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin:12px 0}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
details.key{margin-top:14px;font-size:14px}details.key summary{cursor:pointer;font-weight:600;color:var(--ink)}
@media (max-width:640px){table.acc thead{display:none}table.acc tr.row{display:grid;grid-template-columns:28px 1fr auto;border-bottom:1px solid var(--line)}table.acc td{border:0;padding:14px 8px 6px}table.acc td.why{grid-column:2 / 4;padding:0 8px 14px}.score{min-width:0}.score .bar{display:none}.hide-sm{display:none}.stats{gap:20px}.stats b{font-size:22px}}
</style>
</head>
<body>
<header class="top"><nav>
  <a class="logo" href="/gtm"><i>P</i>Pipeline Scout</a>
  <div class="links"><a href="/gtm" class="hide-sm">Overview</a><a href="/gtm/app" class="on">Find accounts</a><a href="/gtm/guide">Guide</a></div>
</nav></header>
<main class="wrap" id="app" style="padding-bottom:40px"><p class="empty">Loading…</p></main>
<footer class="site"><div class="wrap"><span>Public data only: SEC Form D filings, public job boards and news. Emails are drafts; nothing is ever sent. Size and stage are estimates.</span><div><a href="/">Arjun Agarwal</a><a href="https://github.com/arjuna2204/gtm-agent">GitHub</a></div></div></footer>

<script type="module">
import { PRESETS, DEFAULT_BUYER, TEAM_LABELS, BANDS, rankAll, scoreCompany, sizeOf, WRITER_SYSTEM, buildPrompt, extractJson, checkCitations, validProduct } from "/gtm/assets/scout.js";

const DATA_URL = "/gtm/data/app.json?v=" + Math.floor(Date.now() / 3e5); // new URL every 5 minutes: never stuck on a stale cache
const API_URL = "/api/gtm/writeup";
const store = {  // browser storage can be unavailable (private mode, embedded views): fail quietly
  get(k, s = localStorage) { try { return JSON.parse(s.getItem(k)); } catch { return null; } },
  set(k, v, s = localStorage) { try { s.setItem(k, JSON.stringify(v)); } catch {} },
  del(k, s = localStorage) { try { s.removeItem(k); } catch {} },
};
let APP = null, ROWS = [];
const presetProduct = k => { const { label, ...p } = JSON.parse(JSON.stringify(PRESETS[k])); return p; };
let state = { preset: "spend", product: presetProduct("spend"), buyer: { ...DEFAULT_BUYER }, q: "" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso.slice(0, 10) + "T12:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const daysAgo = iso => iso ? Math.round((Date.now() - new Date(iso.slice(0, 10) + "T12:00:00")) / 864e5) : null;
const loc = c => [c.city, c.state].filter(Boolean).join(", ") || (c.locations[0] || "");
const list = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);
const isDemo = () => JSON.stringify(state.product) === JSON.stringify(presetProduct("spend"));
const productKey = () => btoa(unescape(encodeURIComponent(JSON.stringify([state.product.name, state.product.one_liner, state.product.teams])))).slice(0, 40);
const sigLabel = s => s.type === "raise" ? s.title.replace(/ \(Form D.*?\)/, "") + (daysAgo(s.date) != null ? `, ${daysAgo(s.date)}d ago` : "")
  : s.type === "hiring" ? s.title.replace(/^Hiring: /, "Hiring ") : "New finance leader";

function loadSaved() {
  // a shared link (#/s=...) wins over what this browser saved last time
  const m = location.hash.match(/[#&]s=([^&]+)/);
  let saved = null;
  if (m) { try { saved = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); } catch {} }
  saved = saved || store.get("scout.setup");
  if (saved && saved.product && saved.buyer) state = { ...state, ...saved, buyer: { ...DEFAULT_BUYER, ...saved.buyer } };
}
function save() { store.set("scout.setup", { preset: state.preset, product: state.product, buyer: state.buyer }); }

async function load() {
  loadSaved();
  try { const r = await fetch(DATA_URL, { cache: "no-cache" }); if (!r.ok) throw 0; APP = await r.json(); }
  catch { APP = { companies: [], signal_counts: {}, scored_on: "" }; }
  rerank(); route();
}
function rerank() { ROWS = APP.companies.length ? rankAll(APP.companies, state.product, state.buyer) : []; }

// ------------------------------------------------------------------ views
const chip = (label, on, attrs) => `<button type="button" class="chip${on ? " on" : ""}" aria-pressed="${on}" ${attrs}>${esc(label)}</button>`;

function home() {
  const p = state.product, b = state.buyer;
  const industries = [...new Set(APP.companies.map(c => c.industry).filter(Boolean))].sort();
  const sc = APP.signal_counts || {};
  return `
  <h1 style="margin-top:48px;font-size:48px">Find accounts</h1>
  <p class="lede" style="font-size:18px">Describe what you sell and who buys it. Pipeline Scout ranks companies showing buying signals right now. <a href="/gtm/guide">New here? Read the 2-minute guide.</a></p>
  <form id="setup" class="setup" autocomplete="off">
    <div class="card">
      <div class="eyebrow" style="margin-bottom:10px">1 · Your product</div>
      <div class="field"><div class="label">Start from</div><div class="chips">${Object.entries(PRESETS).map(([k, v]) => chip(v.label, state.preset === k, `data-preset="${k}"`)).join("")}</div></div>
      <div class="field"><label for="p-name">What you sell</label><input id="p-name" value="${esc(p.name)}" placeholder="e.g. an AP automation platform" maxlength="120"></div>
      <div class="field"><label for="p-one">One-line description</label><textarea id="p-one" maxlength="400" placeholder="What it does and the outcome for the customer">${esc(p.one_liner)}</textarea></div>
      <div class="field"><label for="p-titles">Who usually buys it</label><input id="p-titles" value="${esc(p.buyer_titles.join(", "))}" placeholder="VP Finance, Controller" maxlength="200"><div class="hint">Job titles, separated by commas</div></div>
      <div class="field"><div class="label">Buying team</div><div class="chips">${Object.entries(TEAM_LABELS).map(([k, v]) => chip(v, p.teams.includes(k), `data-team="${k}"`)).join("")}</div><div class="hint">Open roles on these teams count as buying signals</div></div>
      <div class="field" style="margin-bottom:0"><label for="p-pains">Problems it solves (optional)</label><input id="p-pains" value="${esc((p.pains || []).join(", "))}" maxlength="400" placeholder="manual AP, slow close"></div>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:10px">2 · Your buyer</div>
      <div class="field"><div class="label">Company size (estimated)</div><div class="chips">${BANDS.map(x => chip(x, b.sizes.includes(x), `data-size="${x}"`)).join("")}</div><div class="hint">None selected = any size</div></div>
      <div class="field"><div class="label">Raised money within</div><div class="chips">${[30, 90, 180, 365].map(d => chip(`${d} days`, b.window_days === d, `data-window="${d}"`)).join("")}</div></div>
      <div class="field"><label for="b-states">US states (optional)</label><input id="b-states" value="${esc(b.states.join(", "))}" placeholder="NY, CA, TX" maxlength="120"><div class="hint">Blank = anywhere in the US</div></div>
      <div class="field"><label for="b-ind">Industry (optional)</label><select id="b-ind"><option value="">Any industry</option>${industries.map(i => `<option${b.industries[0] === i ? " selected" : ""}>${esc(i)}</option>`).join("")}</select></div>
      <div class="field"><div class="label">Must be hiring on the buying team?</div><div class="chips">${chip("Not required", !b.require_hiring, 'data-hire="0"')}${chip("Required", b.require_hiring, 'data-hire="1"')}</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn" type="submit">Find accounts</button><button class="btn line" type="button" id="share">Copy link to this search</button></div>
      <div id="setup-msg"></div>
    </div>
  </form>
  <div class="stats">
    <div><b>${APP.companies.length.toLocaleString()}</b>companies tracked</div>
    <div><b>${(sc.raise || 0).toLocaleString()}</b>recent raises</div>
    <div><b>${(sc.hiring || 0).toLocaleString()}</b>open-role signals</div>
    <div><b>${fmtDate((APP.generated_at || "").slice(0, 10)) || "Pending"}</b>data updated</div>
  </div>
  <div class="toolbar" id="results"><h2 style="margin:0;font-size:34px">${ROWS.length} accounts</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input id="q" class="chip" style="min-width:200px" placeholder="Search company" value="${esc(state.q)}" aria-label="Search company"><button class="btn line sm" id="csv" type="button">Export CSV</button></div></div>
  <div class="card" style="padding:0;overflow-x:auto" id="list">${table()}</div>`;
}

function table() {
  if (!APP.companies.length) return `<p class="empty">The data hasn't loaded yet. Try again in a minute.</p>`;
  if (!validProduct(state.product)) return `<p class="empty">Fill in what you sell, a one-line description, and at least one buying team.</p>`;
  const rows = ROWS.filter(r => !state.q || r.c.name.toLowerCase().includes(state.q.toLowerCase()));
  if (!rows.length) return `<p class="empty">No accounts match. Try a wider size range, a longer funding window, more buying teams, or turn off "must be hiring".</p>`;
  return `<table class="acc"><thead><tr><th>#</th><th>Company</th><th>Score</th><th>Why now</th><th class="hide-sm">Size (est.)</th><th class="hide-sm">Stage (est.)</th></tr></thead><tbody>
  ${rows.slice(0, 300).map(({ c, s, rank }) => `<tr class="row" data-id="${esc(c.id)}" tabindex="0">
    <td class="sub">${rank}</td>
    <td><div class="co">${esc(c.name)}</div><div class="sub">${esc(loc(c))}${c.industry ? " · " + esc(c.industry) : ""}</div></td>
    <td><div class="score">${s.total}<span class="bar"><i style="width:${s.total}%"></i></span></div></td>
    <td class="why">${c.signals.filter(x => s.signal_ids.includes(x.id)).slice(0, 3).map(x => `<span class="tag ${x.type}">${esc(sigLabel(x))}</span>`).join("")}</td>
    <td class="hide-sm" style="white-space:nowrap">${esc(sizeOf(c).band || "–")}</td><td class="hide-sm" style="white-space:nowrap">${esc(c.stage_est || "–")}</td></tr>`).join("")}
  </tbody></table>${rows.length > 300 ? `<p class="note" style="padding:0 16px 16px">Showing the top 300. Export CSV for all ${rows.length}.</p>` : ""}`;
}

function cached(c) {
  if (isDemo() && c.writeup) return { ...c.writeup, source: "demo" };
  return store.get(`scout.w.${c.id}.${productKey()}`);
}

function writeupHtml(c, s, w) {
  const byId = Object.fromEntries(c.signals.map(x => [x.id, x]));
  const cites = ids => (ids || []).map(i => byId[i]).filter(Boolean).map(x => `<a class="src" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">[${x.type === "raise" ? "SEC filing" : x.type === "hiring" ? "job post" : "news"}]</a>`).join("");
  return `
    <div class="card"><div class="label">Why now</div><ul class="why">${w.why_now.map(b => `<li>${esc(b.text)}${cites(b.signal_ids)}</li>`).join("")}</ul></div>
    <div class="card" style="margin-top:20px"><div class="label">Research brief</div><p style="margin:0">${esc(w.brief)}</p>
      <div class="label" style="margin-top:18px">Who to target</div><p style="margin:0"><b style="color:var(--ink)">${esc(w.persona.title)}</b>. ${esc(w.persona.why)}</p></div>
    <h3 style="margin-top:28px">Email sequence</h3>
    ${w.emails.map((e, i) => `<div class="email"><div class="subj"><span>${e.step}. ${esc(e.subject)}</span><button class="copy" data-copy="${i}">Copy</button></div><pre>${esc(e.body)}</pre><div class="note">Cites ${cites(e.signal_ids)}</div></div>`).join("")}
    <p class="note">${w.source === "demo" ? "Pre-written in the weekly run for the demo product." : "Written by Claude from the signals on this page."} Any sentence that couldn't be tied to a source was removed. Drafts only: review, find the right person, and send from your own email.</p>`;
}

function account(id) {
  const row = ROWS.find(r => r.c.id === id);
  const c = row ? row.c : APP.companies.find(x => x.id === id);
  if (!c) return `<a class="btn line sm" style="margin-top:32px" href="#/">← All accounts</a><p class="empty">Account not found.</p>`;
  const s = row ? row.s : scoreCompany(c, state.product, state.buyer);
  const w = cached(c);
  const parts = [["Industry", "industry", 15], ["Size", "size", 15], ["Region", "region", 10], ["Recent raise", "raise", 20], ["Hiring on the buying team", "hiring", 15], ["New finance leader", "leader", 10], ["Signal strength", "strength", 15]];
  const teams = Object.entries(c.team_counts || {}).sort((a, b) => b[1] - a[1]);
  const quota = store.get("scout.quota", sessionStorage);
  return `
  <a class="btn line sm" style="margin-top:32px" href="#/">← All accounts</a>
  <h1 style="margin:20px 0 8px;font-size:48px">${esc(c.name)}</h1>
  <p class="lede" style="font-size:17px">${[loc(c), c.industry, sizeOf(c).band && `about ${sizeOf(c).band} people (est.)`, c.stage_est && `${c.stage_est} (est.)`].filter(Boolean).map(esc).join(" · ")}${c.board_url ? ` · <a href="${esc(safeUrl(c.board_url))}" target="_blank" rel="noopener">Careers page</a>` : ""}</p>
  <div class="split">
    <div id="writeup">${w ? writeupHtml(c, s, w) : `
      <div class="card"><div class="label">Signals behind the score</div><ul class="why">${c.signals.filter(x => s.signal_ids.includes(x.id)).map(x => `<li>${esc(x.title)} <span class="sub">(${fmtDate(x.date)})</span><a class="src" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">[source]</a></li>`).join("") || "<li>No timing signals for this product.</li>"}</ul></div>
      <div class="card" style="margin-top:20px"><div class="label">Brief and email drafts</div>
        <p style="margin:0 0 14px">Claude writes a why-now summary, the person to target, a short brief and a 3-email sequence for <b style="color:var(--ink)">${esc(state.product.name || "your product")}</b>, citing only the signals on this page.</p>
        <button class="btn" id="gen" ${validProduct(state.product) ? "" : "disabled"}>Write brief and emails</button>
        <p class="note">${quota ? esc(quota) : "Free: a few write-ups a day. Or use your own Anthropic API key below for unlimited use."}</p>
        <details class="key"><summary>Use your own Anthropic API key</summary>
          <p class="small">Your key is kept only in this browser tab and sent straight to Anthropic, never to this site's server. <a href="/gtm/guide#own-key">How to get a key</a></p>
          <div class="field"><input id="own-key" type="password" placeholder="sk-ant-..." value="${store.get("scout.key", sessionStorage) ? "••••••••" : ""}" autocomplete="off"></div>
          <button class="btn line sm" id="save-key" type="button">Use this key</button> <button class="btn line sm" id="forget-key" type="button">Forget key</button>
        </details>
        <div id="gen-msg"></div>
      </div>`}
    </div>
    <div>
      <div class="card"><div class="label">Score · ${s.total}/100</div>
        <table><tbody>${parts.map(([l, k, m]) => `<tr><td style="padding:10px 0"><div style="color:var(--ink);font-weight:500">${l}</div><div class="sub">${esc(s.reasons[k] || "")}</div></td><td style="padding:10px 0;text-align:right;white-space:nowrap;font-weight:600;color:var(--ink)">${s.parts[k]}/${m}</td></tr>`).join("")}</tbody></table>
      </div>
      ${teams.length ? `<div class="card" style="margin-top:20px"><div class="label">Open roles by team</div>${teams.map(([t, n]) => `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(TEAM_LABELS[t] || t)}</span><b style="color:var(--ink)">${n}</b></div>`).join("")}</div>` : ""}
      <div class="card" style="margin-top:20px"><div class="label">All signals</div>
        ${c.signals.map(x => `<div style="margin-bottom:12px"><span class="tag ${x.type}">${esc(x.type === "hiring" ? (TEAM_LABELS[x.team] || "hiring") : x.type)}</span> <a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="sub">${fmtDate(x.date)}${x.detail ? " · " + esc(x.detail) : ""}</div></div>`).join("")}
      </div>
    </div>
  </div>`;
}

// ------------------------------------------------------------------ write-ups
async function generate(c) {
  const msg = document.getElementById("gen-msg"), btn = document.getElementById("gen");
  btn.disabled = true; btn.textContent = "Writing… (about 20 seconds)"; msg.innerHTML = "";
  const s = scoreCompany(c, state.product, state.buyer);
  const ownKey = store.get("scout.key", sessionStorage);
  try {
    let draft;
    if (ownKey) {
      const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST",
        headers: { "x-api-key": ownKey, "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-sonnet-5-5", max_tokens: 2000, system: WRITER_SYSTEM, messages: [{ role: "user", content: buildPrompt(c, s, state.product) }] }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j?.error?.message || `Anthropic error ${r.status}`);
      const { clean } = checkCitations(extractJson((j.content || []).map(b => b.text || "").join("")), s.signal_ids);
      draft = clean;
    } else {
      const r = await fetch(API_URL, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ company_id: c.id, product: state.product, buyer: state.buyer }) });
      const j = await r.json().catch(() => ({}));
      if (j.remaining_today != null) store.set("scout.quota", `${j.remaining_today} free write-ups left today.`, sessionStorage);
      if (!r.ok) throw new Error(j.error || `Server error ${r.status}`);
      draft = j.writeup;
    }
    if (!draft.why_now.length || !draft.emails.length) throw new Error("The draft didn't pass the source check. Try again.");
    draft.written_at = new Date().toISOString();
    store.set(`scout.w.${c.id}.${productKey()}`, draft);
    document.getElementById("writeup").innerHTML = writeupHtml(c, s, draft);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Write brief and emails";
    msg.innerHTML = `<div class="alert bad">${esc(e.message || e)}</div>`;
  }
}

function exportCSV() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["rank", "company", "score", "location", "industry", "size_est", "stage_est", "signals"].join(",")]
    .concat(ROWS.map(({ c, s, rank }) => [rank, c.name, s.total, loc(c), c.industry, sizeOf(c).band, c.stage_est, c.signals.filter(x => s.signal_ids.includes(x.id)).map(x => x.title + " " + x.url).join(" | ")].map(q).join(",")));
  const url = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "pipeline-scout-accounts.csv" });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// ------------------------------------------------------------------ events
function readForm() {
  const v = id => (document.getElementById(id) || {}).value;
  if (!document.getElementById("p-name")) return;
  state.product = { ...state.product, name: v("p-name").trim(), one_liner: v("p-one").trim(), buyer_titles: list(v("p-titles")), pains: list(v("p-pains")) };
  state.buyer = { ...state.buyer, states: list(v("b-states")).map(x => x.toUpperCase()).filter(x => /^[A-Z]{2}$/.test(x)), industries: v("b-ind") ? [v("b-ind")] : [] };
}
function refresh() { const y = window.scrollY; rerank(); save(); document.getElementById("app").innerHTML = home(); window.scrollTo(0, y); }
function route() {
  const h = location.hash || "#/";
  const app = document.getElementById("app");
  if (h.startsWith("#/a/")) app.innerHTML = account(decodeURIComponent(h.slice(4)));
  else app.innerHTML = home();
  if (!h.startsWith("#/a/") && /[#&]s=/.test(h)) history.replaceState(null, "", "#/");
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, tr.row");
  if (!t) return;
  if (t.matches("tr.row")) { location.hash = "#/a/" + encodeURIComponent(t.dataset.id); return; }
  if (t.dataset.preset) { readForm(); state.preset = t.dataset.preset; state.product = presetProduct(t.dataset.preset); refresh(); }
  else if (t.dataset.team) { readForm(); const ts = new Set(state.product.teams); ts.has(t.dataset.team) ? ts.delete(t.dataset.team) : ts.add(t.dataset.team); state.product.teams = [...ts]; refresh(); }
  else if (t.dataset.size) { readForm(); const sz = new Set(state.buyer.sizes); sz.has(t.dataset.size) ? sz.delete(t.dataset.size) : sz.add(t.dataset.size); state.buyer.sizes = BANDS.filter(b => sz.has(b)); refresh(); }
  else if (t.dataset.window) { readForm(); state.buyer.window_days = +t.dataset.window; refresh(); }
  else if (t.dataset.hire) { readForm(); state.buyer.require_hiring = t.dataset.hire === "1"; refresh(); }
  else if (t.id === "share") {
    readForm(); save();
    const code = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({ preset: state.preset, product: state.product, buyer: state.buyer })))));
    const url = `${location.origin}${location.pathname}#/s=${code}`;
    navigator.clipboard.writeText(url).then(() => { t.textContent = "Link copied"; setTimeout(() => t.textContent = "Copy link to this search", 1800); });
  }
  else if (t.id === "csv") exportCSV();
  else if (t.id === "gen") { const c = APP.companies.find(x => "#/a/" + encodeURIComponent(x.id) === location.hash); if (c) generate(c); }
  else if (t.id === "save-key") { const k = document.getElementById("own-key").value.trim(); if (/^sk-ant-/.test(k)) { store.set("scout.key", k, sessionStorage); document.getElementById("gen-msg").innerHTML = `<div class="alert">Using your key for this tab.</div>`; } else document.getElementById("gen-msg").innerHTML = `<div class="alert bad">That doesn't look like an Anthropic key (they start with sk-ant-).</div>`; }
  else if (t.id === "forget-key") { store.del("scout.key", sessionStorage); document.getElementById("own-key").value = ""; document.getElementById("gen-msg").innerHTML = `<div class="alert">Key removed.</div>`; }
  else if (t.dataset.copy != null) {
    const c = APP.companies.find(x => "#/a/" + encodeURIComponent(x.id) === location.hash);
    const w = c && cached(c), em = w && w.emails[+t.dataset.copy];
    if (em) navigator.clipboard.writeText(`Subject: ${em.subject}\n\n${em.body}`).then(() => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy", 1500); });
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "setup") return;
  e.preventDefault(); readForm();
  if (!validProduct(state.product)) { document.getElementById("setup-msg").innerHTML = `<div class="alert bad">Add what you sell, a one-line description and at least one buying team.</div>`; return; }
  refresh(); document.getElementById("results").scrollIntoView({ behavior: "smooth" });
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr.row")) e.target.click(); });
document.addEventListener("input", e => { if (e.target.id === "q") { state.q = e.target.value; document.getElementById("list").innerHTML = table(); } });
window.addEventListener("hashchange", route);
load();
</script>
</body>
</html>
