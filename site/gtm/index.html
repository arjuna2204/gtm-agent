<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Scout · Find companies that need your product this week</title>
<meta name="description" content="Pipeline Scout finds companies that need a product right now, shows why with sourced public signals, and drafts the outreach. Built by Arjun Agarwal.">
<meta property="og:title" content="Pipeline Scout">
<meta property="og:description" content="Find companies that need your product this week, and why.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#FAF8F4;--card:#FFFFFF;--ink:#0B1F3A;--body:#3E4A5C;--muted:#667085;--line:#E6E1D8;--accent:#0E7C66;--accent-bg:#E6F2EE;--sand:#F1ECE3;--warn:#9A6A00;--warn-bg:#FFF6E0}
@media (prefers-color-scheme:dark){:root{--ground:#0E1420;--card:#151C2A;--ink:#EEF1F6;--body:#C5CCD8;--muted:#8E98AA;--line:#273042;--accent:#3FB896;--accent-bg:#14302A;--sand:#1B2333;--warn:#E3B341;--warn-bg:#2B2410}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.55}
a{color:var(--ink)}a:hover{color:var(--accent)}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header.top{border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-family:'Newsreader',serif;font-size:22px;color:var(--ink);text-decoration:none}
nav a{margin-left:24px;text-decoration:none;font-weight:500;font-size:15px;color:var(--body)}
nav a.on{color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:4px}
h1,h2,h3{color:var(--ink);font-family:'Newsreader',serif;font-weight:400;letter-spacing:-0.01em}
h1{font-size:56px;line-height:1.05;margin:56px 0 16px;max-width:820px}
h2{font-size:32px;margin:48px 0 12px}
h3{font-size:22px;margin:28px 0 8px}
.lede{font-size:19px;max-width:680px;margin:0 0 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.chip.on[disabled]{opacity:1;cursor:default}
.btn{min-height:44px;padding:0 20px;border-radius:999px;font-weight:600;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--ground)}
.btn.ghost{background:transparent;color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:32px;margin:28px 0 8px;color:var(--muted);font-size:14px}
.stats b{display:block;font-size:28px;color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--sand)}
.co{font-weight:600;color:var(--ink)}
.sub{font-size:13px;color:var(--muted)}
.score{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);min-width:110px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--accent)}
.sig{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin:0 6px 6px 0;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
.sig.hiring{background:var(--sand);color:var(--ink)}
.sig.leader{background:var(--warn-bg);color:var(--warn)}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:48px 0 12px}
.toolbar h2{margin:0}
.empty{padding:48px;text-align:center;color:var(--muted)}
.back{display:inline-block;margin:32px 0 0;text-decoration:none;font-weight:500}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-top:24px}
@media (max-width:860px){.split{grid-template-columns:1fr}h1{font-size:40px}.hide-sm{display:none}}
ul.why{padding-left:20px;margin:0}ul.why li{margin-bottom:10px}
.src{font-size:13px;margin-left:6px}
.email{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--ground)}
.email .subj{font-weight:600;color:var(--ink);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
.email pre{white-space:pre-wrap;font-family:inherit;margin:0}
.copy{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.flow{counter-reset:s;list-style:none;padding:0;margin:0}
.flow li{counter-increment:s;padding:16px 0 16px 52px;position:relative;border-bottom:1px solid var(--line)}
.flow li:before{content:counter(s);position:absolute;left:0;top:14px;width:34px;height:34px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-weight:700;display:grid;place-items:center}
@media (max-width:640px){table.acc thead{display:none}table.acc tr.row{display:grid;grid-template-columns:28px 1fr auto;border-bottom:1px solid var(--line)}table.acc td{border:0;padding:14px 8px 6px}table.acc td.why{grid-column:2 / 4;padding:0 8px 14px}.score{min-width:0}.score .bar{display:none}.stats{gap:20px}.stats b{font-size:22px}}
footer{margin:80px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:24px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">Pipeline Scout</a>
  <nav><a href="#/" id="nav-home">Accounts</a><a href="#/how" id="nav-how">How it works</a><a href="https://iamarjunagarwal.com" class="hide-sm">Arjun Agarwal</a></nav>
</div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<div class="wrap"><footer>Built by <a href="https://iamarjunagarwal.com">Arjun Agarwal</a>. Public data only: SEC Form D filings, public job boards and news. Emails are drafts; nothing is ever sent. Size and stage are estimates.</footer></div>
<script>
"use strict";
const DATA_URL = "/gtm/data/app.json";
let APP = null;
const state = {sizes: new Set(), window: 180, hiring: "any", industry: "", q: ""};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso.slice(0,10) + "T12:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"}); };
const daysAgo = iso => iso ? Math.round((Date.now() - new Date(iso.slice(0,10) + "T12:00:00")) / 864e5) : null;
const loc = a => [a.city, a.state].filter(Boolean).join(", ") || (a.locations[0] || "");
const sigLabel = s => s.type === "raise" ? s.title.replace(/ \(Form D.*?\)/, "") + (daysAgo(s.date) != null ? `, ${daysAgo(s.date)}d ago` : "")
  : s.type === "hiring" ? s.title.replace(/^Hiring: /, "Hiring ") : "New finance leader";

async function load() {
  try {
    const r = await fetch(DATA_URL, {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    APP = await r.json();
  } catch (e) {
    APP = {accounts: [], stats: {}, product: {name: "a spend management platform"}, buyer: {size_bands: []}, review: {}};
  }
  APP.buyer.size_bands.forEach(b => state.sizes.add(b));
  route();
}

function filtered() {
  return APP.accounts.filter(a => {
    if (state.sizes.size && a.size_est && !state.sizes.has(a.size_est)) return false;
    if (state.industry && a.industry !== state.industry) return false;
    // An older raise drops the account; accounts with no raise still qualify on hiring or leader signals.
    const raise = a.signals.find(s => s.type === "raise" && s.used);
    if (raise && daysAgo(raise.date) > state.window) return false;
    if (state.hiring === "stack" && !a.signals.some(s => s.used && s.role_class === "stack")) return false;
    if (state.hiring === "finance" && !a.signals.some(s => s.used && s.type === "hiring")) return false;
    if (state.q && !a.name.toLowerCase().includes(state.q.toLowerCase())) return false;
    return true;
  });
}

function chip(label, on, attrs) { return `<button class="chip${on ? " on" : ""}" ${attrs}>${esc(label)}</button>`; }

function home() {
  const st = APP.stats || {}, sig = st.signals || {};
  const industries = [...new Set(APP.accounts.map(a => a.industry).filter(Boolean))].sort();
  return `
  <h1>Find companies that need your product this week, and why.</h1>
  <p class="lede">Pipeline Scout reads public signals: fresh fundraises, finance hiring and new finance leaders. It ranks the accounts most likely to buy now and drafts outreach that cites every fact.</p>
  <div class="card">
    <div class="grid">
      <div><div class="label">Product</div><div class="chips">
        ${chip("Spend management", true, "disabled aria-pressed=true")}
        ${chip("Payroll · soon", false, "disabled")}${chip("Treasury · soon", false, "disabled")}${chip("AP automation · soon", false, "disabled")}
      </div></div>
      <div><div class="label">Company size (est.)</div><div class="chips">
        ${["under 50","50-200","200-500","500+"].map(b => chip(b, state.sizes.has(b), `data-size="${b}" aria-pressed="${state.sizes.has(b)}"`)).join("")}
      </div></div>
      <div><div class="label">Raised within</div><div class="chips">
        ${[30,90,180].map(d => chip(`${d} days`, state.window === d, `data-window="${d}" aria-pressed="${state.window === d}"`)).join("")}
      </div></div>
      <div><div class="label">Hiring in finance</div><div class="chips">
        ${[["any","Any"],["finance","Any finance role"],["stack","Controller, FP&A, AP"]].map(([k,l]) => chip(l, state.hiring === k, `data-hiring="${k}" aria-pressed="${state.hiring === k}"`)).join("")}
      </div></div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center">
      <select id="industry" class="chip" aria-label="Industry"><option value="">All industries</option>${industries.map(i => `<option${i === state.industry ? " selected" : ""}>${esc(i)}</option>`).join("")}</select>
      <input id="q" class="chip" style="min-width:220px" placeholder="Search company" value="${esc(state.q)}" aria-label="Search company">
      <button class="btn" id="find">Find accounts</button>
    </div>
    <p class="note">Region: United States. Results come from the latest weekly run; live search on any product is on the roadmap.</p>
  </div>
  <div class="stats">
    <div><b>${APP.accounts.length}</b>accounts ranked</div>
    <div><b>${(sig.raise||0).toLocaleString()}</b>fundraise signals</div>
    <div><b>${(sig.hiring||0).toLocaleString()}</b>finance-hiring signals</div>
    <div><b>${fmtDate(APP.scored_on) || "Pending"}</b>last scored</div>
  </div>
  <div class="toolbar" id="results"><h2>Accounts</h2><button class="btn ghost" id="csv">Export CSV</button></div>
  <div class="card" style="padding:0;overflow-x:auto" id="list">${table()}</div>`;
}

function table() {
  const rows = filtered();
  if (!APP.accounts.length) return `<p class="empty">The first data run hasn't finished yet. Check back after the next daily collection.</p>`;
  if (!rows.length) return `<p class="empty">No accounts match these filters. Try widening the size range or funding window.</p>`;
  return `<table class="acc"><thead><tr><th>#</th><th>Company</th><th>Score</th><th>Why now</th><th class="hide-sm">Size (est.)</th><th class="hide-sm">Stage (est.)</th></tr></thead><tbody>
  ${rows.map(a => `<tr class="row" data-id="${esc(a.id)}" tabindex="0">
    <td class="sub">${a.rank}</td>
    <td><div class="co">${esc(a.name)}</div><div class="sub">${esc(loc(a))}${a.industry ? " · " + esc(a.industry) : ""}</div></td>
    <td><div class="score">${a.score}<span class="bar"><i style="width:${a.score}%"></i></span></div></td>
    <td class="why">${a.signals.filter(s => s.used).slice(0,3).map(s => `<span class="sig ${s.type}">${esc(sigLabel(s))}</span>`).join("")}</td>
    <td class="hide-sm">${esc(a.size_est || "–")}</td><td class="hide-sm">${esc(a.stage_est || "–")}</td></tr>`).join("")}
  </tbody></table>`;
}

function account(id) {
  const a = APP.accounts.find(x => x.id === id);
  if (!a) return `<a class="back" href="#/">← All accounts</a><p class="empty">Account not found.</p>`;
  const byId = Object.fromEntries(a.signals.map(s => [s.id, s]));
  const w = a.writeup;
  const cites = ids => (ids || []).map(i => byId[i]).filter(Boolean).map(s => `<a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">[${esc(s.type === "raise" ? "SEC filing" : s.type === "hiring" ? "job post" : "news")}]</a>`).join("");
  const parts = [["Industry","industry",15],["Size","size",15],["Region","region",10],["Recent raise","raise",20],["Finance hiring","hiring",15],["New finance leader","leader",10],["Signal strength","strength",15]];
  return `
  <a class="back" href="#/">← All accounts</a>
  <h1 style="margin-top:20px">${esc(a.name)}</h1>
  <p class="lede">${[loc(a), a.industry, a.size_est && `about ${a.size_est} people (est.)`, a.stage_est && `${a.stage_est} (est.)`].filter(Boolean).map(esc).join(" · ")}
   ${a.board_url ? ` · <a href="${esc(safeUrl(a.board_url))}" target="_blank" rel="noopener">Careers page</a>` : ""}</p>
  <div class="split">
    <div>
      <div class="card"><div class="label">Why now</div>
        ${w && w.why_now.length ? `<ul class="why">${w.why_now.map(b => `<li>${esc(b.text)}${cites(b.signal_ids)}</li>`).join("")}</ul>`
          : `<ul class="why">${a.signals.filter(s => s.used).map(s => `<li>${esc(s.title)} <span class="sub">(${fmtDate(s.date)})</span><a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">[source]</a></li>`).join("")}</ul>`}
      </div>
      ${w ? `<div class="card" style="margin-top:24px"><div class="label">Research brief</div><p style="margin:0">${esc(w.brief)}</p>
        <div class="label" style="margin-top:20px">Who to target</div><p style="margin:0"><b style="color:var(--ink)">${esc(w.persona.title)}</b>. ${esc(w.persona.why)}</p></div>
      <h3>Email sequence</h3>
      ${w.emails.map((e, i) => `<div class="email"><div class="subj"><span>${e.step}. ${esc(e.subject)}</span><button class="copy" data-copy="${i}">Copy</button></div><pre>${esc(e.body)}</pre><div class="note">Cites ${cites(e.signal_ids)}</div></div>`).join("")}
      <p class="note">Drafts only. Written by Claude from the signals above; any sentence that couldn't be tied to a source was removed.</p>`
      : `<p class="note">This account isn't in the weekly top 100, so it has no drafted brief or emails yet.</p>`}
    </div>
    <div>
      <div class="card"><div class="label">Score breakdown · ${a.score}/100</div>
        <table><tbody>${parts.map(([l,k,m]) => `<tr><td style="padding:10px 0"><div style="color:var(--ink);font-weight:500">${l}</div><div class="sub">${esc(a.reasons[k] || "")}</div></td><td style="padding:10px 0;text-align:right;white-space:nowrap;font-weight:600;color:var(--ink)">${a.parts[k]}/${m}</td></tr>`).join("")}</tbody></table>
      </div>
      <div class="card" style="margin-top:24px"><div class="label">All signals</div>
        ${a.signals.map(s => `<div style="margin-bottom:12px"><span class="sig ${s.type}">${esc(s.type)}</span> <a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.title)}</a><div class="sub">${fmtDate(s.date)}${s.detail ? " · " + esc(s.detail) : ""}</div></div>`).join("")}
      </div>
    </div>
  </div>`;
}

function how() {
  const rv = APP.review || {};
  return `
  <h1>How Pipeline Scout works</h1>
  <p class="lede">Code does the gathering and scoring, so results are consistent and explainable. Claude only reads and writes, and every claim it makes must point to a stored source.</p>
  <div class="card"><ol class="flow">
    <li><b style="color:var(--ink)">Collect, daily.</b> SEC Form D filings (private fundraises), Greenhouse, Lever and Ashby job boards (finance hiring), and news headlines (new CFOs). Funds, real estate and raises under $1M are filtered out.</li>
    <li><b style="color:var(--ink)">Score, weekly.</b> A 100-point rubric: fit (industry, size, region) plus timing (recent raise, finance hiring, new finance leader) plus signal strength.</li>
    <li><b style="color:var(--ink)">Write, weekly.</b> For the top 100, Claude drafts the why-now bullets, the persona to target, a short brief and a 3-email sequence.</li>
    <li><b style="color:var(--ink)">Check.</b> Every bullet and email must cite signal IDs that exist in the database. Anything else is dropped before it reaches this page.</li>
    <li><b style="color:var(--ink)">Show.</b> This page reads saved results, so it loads instantly and costs nothing per visit. Nothing is ever sent.</li>
  </ol></div>
  <h2>The scoring rubric</h2>
  <div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Component</th><th>Points</th><th>Rule</th></tr></thead><tbody>
    <tr><td>Industry fit</td><td>15</td><td>Target industry 15, adjacent or unknown 8</td></tr>
    <tr><td>Size fit</td><td>15</td><td>In range 15, next band 8 (size estimated from open roles)</td></tr>
    <tr><td>Region</td><td>10</td><td>US-based</td></tr>
    <tr><td>Recent raise</td><td>20</td><td>Under 30 days 20, 30 to 90 days 14, 90 to 180 days 6</td></tr>
    <tr><td>Finance hiring</td><td>15</td><td>Controller, FP&amp;A, AP or head of finance 15; other finance roles 8</td></tr>
    <tr><td>New finance leader</td><td>10</td><td>CFO or VP Finance announced in the last 120 days, confirmed by Claude</td></tr>
    <tr><td>Signal strength</td><td>15</td><td>5 per independent signal type</td></tr>
  </tbody></table></div>
  <h2>Does it work?</h2>
  <div class="card"><p style="margin:0">${rv.graded ? `<b style="color:var(--ink);font-size:22px">${rv.fit} of ${rv.graded}</b> top accounts were judged a real fit in a hand review (${esc(rv.date || "")}).` : "Hand review of the top 50 accounts is in progress; the hit rate will be published here."}</p></div>
  <h2>Guardrails</h2>
  <div class="card"><ul class="why">
    <li>Public data only: no LinkedIn scraping, no paid databases, no personal emails or phone numbers.</li>
    <li>Drafts only. Nothing is ever sent, which keeps it clear of spam rules.</li>
    <li>The demo product is described generically, not as any real company's product.</li>
    <li>Size and stage are labelled estimates, and claims without a source are removed.</li>
  </ul></div>
  <h2>What I'd build next</h2>
  <div class="card"><ul class="why">
    <li>Live search for any product and buyer profile.</li>
    <li>CRM sync and routing accounts to reps by territory.</li>
    <li>A weekly "new this week" feed, and a contact database for named people.</li>
  </ul></div>`;
}

function exportCSV() {
  const rows = filtered(), q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["rank","company","score","location","industry","size_est","stage_est","signals"].join(",")]
    .concat(rows.map(a => [a.rank, a.name, a.score, loc(a), a.industry, a.size_est, a.stage_est, a.signals.filter(s => s.used).map(s => s.title + " " + s.url).join(" | ")].map(q).join(",")));
  const url = URL.createObjectURL(new Blob([lines.join("\n")], {type: "text/csv"}));
  const el = Object.assign(document.createElement("a"), {href: url, download: "pipeline-scout-accounts.csv"});
  document.body.appendChild(el); el.click(); el.remove(); URL.revokeObjectURL(url);
}

function route() {
  const h = location.hash || "#/";
  const app = document.getElementById("app");
  document.getElementById("nav-home").classList.toggle("on", !h.startsWith("#/how"));
  document.getElementById("nav-how").classList.toggle("on", h.startsWith("#/how"));
  if (h.startsWith("#/account/")) app.innerHTML = account(decodeURIComponent(h.slice(10)));
  else if (h.startsWith("#/how")) app.innerHTML = how();
  else app.innerHTML = home();
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, tr.row");
  if (!t) return;
  if (t.matches("tr.row")) { location.hash = "#/account/" + encodeURIComponent(t.dataset.id); return; }
  if (t.dataset.size) { state.sizes.has(t.dataset.size) ? state.sizes.delete(t.dataset.size) : state.sizes.add(t.dataset.size); refresh(); }
  else if (t.dataset.window) { state.window = +t.dataset.window; refresh(); }
  else if (t.dataset.hiring) { state.hiring = t.dataset.hiring; refresh(); }
  else if (t.id === "find") document.getElementById("results").scrollIntoView({behavior: "smooth"});
  else if (t.id === "csv") exportCSV();
  else if (t.dataset.copy != null) {
    const a = APP.accounts.find(x => "#/account/" + encodeURIComponent(x.id) === location.hash);
    const em = a && a.writeup && a.writeup.emails[+t.dataset.copy];
    if (em) navigator.clipboard.writeText(`Subject: ${em.subject}\n\n${em.body}`).then(() => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy", 1500); });
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr.row")) e.target.click(); });
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; document.getElementById("list").innerHTML = table(); }
  if (e.target.id === "industry") { state.industry = e.target.value; document.getElementById("list").innerHTML = table(); }
});
function refresh() { const y = window.scrollY; document.getElementById("app").innerHTML = home(); window.scrollTo(0, y); }
window.addEventListener("hashchange", route);
load();
</script>
</body>
</html>
